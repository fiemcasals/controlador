{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAE Control</title>

  <!-- Inyectamos la URL del WebSocket desde Django a JS -->
  <script>
    console.log("VEHICLE_WS_URL desde Django:", "{{ vehicle_ws_url }}");
    window.VEHICLE_WS_URL = "{{ vehicle_ws_url|default:''|escapejs }}";
  </script>

  <!-- Script principal (usa ws.client.js dentro) -->
  <script type="module" src="{% static 'core/js/script.js' %}?v={{ timestamp|default:'' }}"></script>

  <!-- CSS global -->
  <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
  <!-- CSS específico del layout -->
  <link rel="stylesheet" href="{% static 'core/css/layout.css' %}">
</head>

<body>
<nav>
  {% if user.is_authenticated %}
    <a href="/accounts/logout/">Cerrar sesión</a>
  {% else %}
    <a href="/accounts/login/">Ingresar</a> · <a href="/registrarse/">Registrarse</a>
  {% endif %}

  <a href="/">Inicio</a>

  <!-- Cámaras -->
  <a href="/camara/">Cámara</a>
  <a href="/camara/grid/">Cámara (grid)</a>
  <a href="/camara/depth/">Cámara (profundidad)</a>

  <!-- Control -->
  <a href="/controlador/">Controlador</a>
  <a href="/mix/">Mixto</a>

  <!-- Nueva sección de sensores -->
  <a href="/sensores/">Sensores</a>

  <!-- (Opcional) Vista de detección de objetos -->
  <a href="/deteccion/">Detección</a>

  {% if user.is_staff %}
    <a href="/admin/">Admin</a>
  {% endif %}

   <!-- Nuevo: Monitor del sistema -->
  <a href="/monitor/">Monitor</a>
</nav>

<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
