{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Joystick Virtual</title>

  <!-- Inyectamos la URL del WebSocket solo para el iframe -->
  <script>
    console.log("VEHICLE_WS_URL (iframe):", "{{ vehicle_ws_url }}");
    window.VEHICLE_WS_URL = "{{ vehicle_ws_url|default:''|escapejs }}";
  </script>

  <!-- JS principal (usa ws.client.js, etc) -->
  <script type="module" src="{% static 'core/js/script.js' %}?v={{ timestamp|default:'' }}"></script>
  <!-- Lógica específica del joystick: toolbar, replay, etc. -->
  <script type="module" src="{% static 'core/js/joystick.page.js' %}" defer></script>

  <!-- CSS global que quieras compartir -->
  <link rel="stylesheet" href="{% static 'core/css/styles.css' %}" />
  <!-- CSS específico del joystick -->
  <link rel="stylesheet" href="{% static 'core/css/joystick.css' %}" />
</head>
<body>
  <noscript>Necesitas habilitar JavaScript para usar el joystick.</noscript>

  {# Cuerpo real del joystick (toolbar + layout) #}
  {% include "core/partials/_joystick_body.html" %}
</body>
</html>
